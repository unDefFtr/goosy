[package]
name = "goosy"
version = "0.1.0"
edition = "2024"
build = "build.rs"
default-run = "goosy"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rfd"]
gui-next = ["dep:goosy-rinui"]

[[bin]]
name = "goosy"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "goosy-gui-next"
path = "src/bin/goosy-gui-next.rs"
required-features = ["gui-next"]

[lib]
name = "libgoosy"
crate-type = ["rlib", "cdylib", "staticlib"]
[dependencies]
skia-safe = { version = "0.99", features = ["textlayout"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
unicode-segmentation = "1"
quick-xml = "0.37"
indicatif = "0.18.6"
eframe = { version = "0.36.1", optional = true, default-features = false, features = ["default_fonts", "wgpu"] }
rfd = { version = "0.17.2", optional = true }
serde_json = "1"
ffmpeg-next = "9"
goosy-rinui = { path = "gui-next", optional = true }
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.3", default-features = false }
objc2-metal = { version = "0.3.2", default-features = false, features = ["MTLCommandBuffer", "MTLCommandQueue", "MTLDevice", "MTLDrawable", "MTLPixelFormat", "MTLTypes"] }
skia-safe = { version = "0.99", features = ["metal"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
eframe = { version = "0.36.1", optional = true, default-features = true }
[target.'cfg(target_os = "linux")'.dependencies]
ash = "0.38"
skia-safe = { version = "0.99", features = ["vulkan"] }

[target.'cfg(target_os = "windows")'.dependencies]
skia-safe = { version = "0.99", features = ["d3d", "gl"] }
khronos-egl = { version = "6", default-features = false, features = ["dynamic", "1_5"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = 3
lto = "thin"
